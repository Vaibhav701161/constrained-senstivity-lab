name: evidence-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  replay-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install lightweight test environment
        run: python -m pip install -e ".[dev]"
      - name: Compile Python sources
        run: python -m compileall -q src scripts tests
      - name: Verify documentation facts and figure synchronization
        run: |
          python scripts/verify_docs_facts.py
          python scripts/sync_docs_figures.py --check
      - name: Replay stored artifact scopes
        run: >-
          python scripts/replay_artifacts.py
          --scope all
          --out /tmp/replay-validation.json
      - name: Run tests
        run: python -m pytest
