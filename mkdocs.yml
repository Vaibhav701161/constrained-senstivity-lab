# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json
site_name: Constrained Sensitivity Lab
site_description: Artifact-backed evaluation of how structured-output contracts change model behavior
site_url: https://vaibhav701161.github.io/constrained-senstivity-lab/
repo_url: https://github.com/Vaibhav701161/constrained-senstivity-lab
repo_name: Source on GitHub
edit_uri: edit/master/docs/
copyright: Copyright &copy; 2026 Vaibhav Mittal. Research artifacts released under the MIT License.

theme:
  name: material
  language: en
  custom_dir: docs/overrides
  icon:
    repo: fontawesome/brands/github
  logo: assets/brand/mark.svg
  favicon: assets/brand/mark.svg
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.view
    - content.tabs.link
    - content.tooltips
    - toc.follow

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - assets/stylesheets/extra.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Vaibhav701161
      name: Vaibhav Mittal on GitHub
    - icon: fontawesome/brands/dev
      link: https://dev.to/vaibhav_mittal_ac22a2c5d6
      name: Vaibhav Mittal on DEV Community
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/vaibhavmittal701161
      name: Vaibhav Mittal on LinkedIn

validation:
  nav:
    omitted_files: info
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

# Local-only research direction files are intentionally excluded from both the
# public site and search index. The directory is also excluded from Git tracking.
exclude_docs: |
  /project-direction/
  /end-to-end-context-transfer.md
  /overrides/

nav:
  - Overview: index.md
  - Start:
      - Orientation: getting-started/overview.md
      - Quickstart: getting-started/quickstart.md
      - Constrained decoding: concepts/constrained-decoding.md
      - Contract sensitivity: concepts/contract-sensitivity.md
  - Findings:
      - Results dashboard: results/index.md
      - Evidence overview: studies/evidence-overview.md
      - Current evidence status: evidence-status.md
  - Studies:
      - Qwen baseline: studies/qwen-baseline.md
      - Corrected Qwen replication: studies/corrected-qwen.md
      - Llama replication: studies/llama-replication.md
      - Canonical correction: studies/canonical-correction.md
      - Executable tool-call pilot: studies/tool-call-pilot.md
  - System:
      - System overview: system/index.md
      - Architecture: architecture.md
      - Supported contracts: supported-contracts.md
  - Methods:
      - Cross-study methodology: methods/index.md
      - Metric definitions: methods/metrics.md
  - Reproduce:
      - Reproduce and audit: reproducibility/index.md
      - Artifact replay: reproducibility/artifact-replay.md
      - Evidence map: reproducibility/evidence-map.md
      - Frozen local environment: environment.md
  - Archive:
      - Historical record: archive/index.md
      - Baseline methodology: methodology.md
      - Baseline research report: research-report.md
      - Representation alignment gate: representation-alignment-results.md
      - Engineering observations: engineering-observations.md
      - Earlier records:
          - Qwen2.5 0.5B: run-ledgers/qwen2.5-0.5b.md
          - Qwen2.5 7B: run-ledgers/qwen2.5-7b.md
          - Foundational probes: archive/foundational-probes.md
          - Local pilot: archive/local-pilot.md
          - Alignment pivot decision: decisions/contract-alignment-pivot.md
  - Publications: publications.md
