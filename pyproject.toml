[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "constrained-sensitivity-lab"
version = "0.1.0"
description = "Artifact-backed evaluation of structured-output contract sensitivity and semantic regressions"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vaibhav Mittal" }]
dependencies = [
  "jsonschema==4.23.0",
]

[project.optional-dependencies]
analysis = [
  "matplotlib==3.10.5",
  "numpy>=2.0,<3",
]
generation = [
  "accelerate==1.6.0",
  "datasets==3.6.0",
  "torch==2.6.0",
  "transformers==4.51.3",
]
outlines = ["outlines==1.3.2"]
xgrammar = ["xgrammar==0.2.3"]
dev = ["pytest==8.3.5"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
