[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "constrained-sensitivity-lab"
version = "0.1.0"
description = "Artifact-backed evaluation of structured-output contract sensitivity and semantic regressions"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vaibhav Mittal" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "jsonschema==4.23.0",
]

[project.urls]
Homepage = "https://vaibhav701161.github.io/constrained-senstivity-lab/"
Documentation = "https://vaibhav701161.github.io/constrained-senstivity-lab/"
Repository = "https://github.com/Vaibhav701161/constrained-senstivity-lab"
Issues = "https://github.com/Vaibhav701161/constrained-senstivity-lab/issues"

[project.optional-dependencies]
analysis = [
  "matplotlib==3.10.5",
  "numpy>=2.0,<3",
]
generation = [
  "accelerate==1.6.0",
  "datasets==3.6.0",
  "torch==2.6.0",
  "transformers==4.51.3",
]
outlines = ["outlines==1.3.2"]
xgrammar = ["xgrammar==0.2.3"]
dev = ["pytest==8.3.5"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
